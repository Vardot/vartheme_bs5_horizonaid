name: Vartheme BS5 Horizonaid
description: Starterkit theme for Varbase standard websites. Based on Bootstrap 5 framework using SASS.
core_version_requirement: ^10.3 || ^11
engine: twig
type: theme
base theme: false
starterkit: true
auto_switch_components: true
screenshot: screenshot.png
alt text: Screenshot of Vartheme BS5 Horizonaid, Varbase front-end theme.

regions:
  content: Content
  header: Header
  footer: Footer
libraries:
  - vartheme_bs5_horizonaid/framework

ckeditor_stylesheets: false
ckeditor5-stylesheets:
  - css/base/ckeditor5.bootstrap.base.css
enforce_prop_schemas: false

$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion
description: A single section of content that can be collapsed and expanded, with a plus/minus icon toggle and smooth height animation.
group: Layout
props:
  type: object
  properties:
    title:
      type: string
      title: Heading
      description: Text shown in the accordion header button.
      examples:
        - Section title
    heading_level:
      type: integer
      title: Heading level
      description: Choose which heading tag to use for the accordion heading.
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
      meta:enum:
        2: H2
        3: H3
        4: H4
        5: H5
        6: H6
      default: 3
      examples:
        - 3
    open_by_default:
      type: boolean
      title: Expanded by default
      description: Open this accordion item when the page first loads.
      default: true
      examples:
        - true
    parent_id:
      type: string
      title: Parent accordion ID
      description: >-
        Optional accordion container ID used to group items so only one stays
        open at a time. Usually this is provided automatically by the
        Accordion container.
      default: ''
    item_id:
      type: string
      title: Item ID
      description: >-
        Optional stable ID suffix for this accordion item. Useful for links,
        testing, or automation.
      default: ''
    always_open:
      type: boolean
      title: Keep this item independent
      description: Allow this item to stay open without being controlled by the parent accordion.
      default: false
      examples:
        - false
slots:
  accordion_content:
    title: Accordion content
    description: Content in this slot will be hidden when the accordion is collapsed.
    examples:
      - '<p>Accordion body content…</p>'

libraryOverrides:
  js:
    accordion-block.js: {}
  dependencies:
    - core/once


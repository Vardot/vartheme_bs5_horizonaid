$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion container
description: A container for any content, only one of whose accordions may be open at a time.
group: Layout
props:
  type: object
  properties:
    id:
      type: string
      title: Accordion ID
      description: Used to group nested accordion items so only one stays open at a time. Leave empty to auto-generate.
      default: ''
    always_open:
      type: boolean
      title: Keep multiple items open
      description: Allow multiple accordion items to stay open at the same time.
      default: false
      examples:
        - false

slots:
  accordion_content:
    title: Accordion content
    description: Place one or more accordion items inside this slot.

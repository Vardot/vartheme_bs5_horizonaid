$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Country Card
group: Card
status: stable
description: 'Country/destination card with an uploaded photo, a drag-and-drop content area, and a "Learn more" style link. Built with Bootstrap 5 utility classes; the footer is clipped to a compact height by default and expands on hover to reveal the full content and link.'
props:
  type: object
  properties:
    card_border:
      type: boolean
      title: Card border
      description: Add a default border for the card.
      default: false
      examples:
        - false
    background_color:
      type: string
      title: Footer background color
      description: Brand background color applied to the card footer.
      default: bg-dark
      examples:
        - bg-dark
      enum:
        - none
        - bg-body-tertiary
        - bg-tertiary
        - bg-accent
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-dark
      meta:enum:
        none: None
        bg-body-tertiary: Body tertiary
        bg-tertiary: Tertiary
        bg-accent: Accent
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-dark: Dark
    box_shadow:
      type: string
      title: Shadow
      description: Bootstrap shadow utility applied to the card.
      default: shadow-none
      examples:
        - shadow-none
      enum:
        - shadow-none
        - shadow-sm
        - shadow
        - shadow-lg
      meta:enum:
        shadow-none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
    corner_style:
      type: string
      title: Border radius
      description: Bootstrap rounded utility applied to the card.
      default: rounded-4
      examples:
        - rounded-4
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill
    equal_height:
      type: boolean
      title: Equal height
      description: Apply h-100 to the card wrapper.
      default: false
      examples:
        - false
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Photo
      description: Upload the country/destination photo. Fills the card above the footer with a cover crop.
      examples:
        - src: /themes/contrib/vartheme_bs5_horizonaid/components/foundation/images/assets/teaser-1.png
          alt: ''
          width: 261
          height: 340
    link_url:
      type: string
      title: Link URL
      format: uri-reference
      description: Optional "Learn more" link. Leave empty to hide the link.
      default: ''
    link_text:
      type: string
      title: Link text
      description: Visible label for the link.
      default: 'Learn more'
      examples:
        - 'Learn more'
    link_target:
      type: string
      title: Link target
      enum:
        - default
        - _self
        - _blank
      default: default
      examples:
        - default
      meta:enum:
        default: Default (same tab)
        _self: Same tab
        _blank: New tab
slots:
  content:
    title: Country content
    description: Drag & drop content slot — drop a Heading and a Text component for the country name and description. Clipped to a compact height until the card is hovered or focused (always shown in the Drupal Canvas editor).
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

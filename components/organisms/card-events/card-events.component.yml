$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Events Card
group: Card
status: stable
description: 'Two-tone event card with a taxonomy label, a single drag-and-drop content slot, and a date/time bar. Headings dropped in the content slot switch to the accent color on hover. Built with Bootstrap 5 utility classes.'
props:
  type: object
  properties:
    taxonomy_label:
      type: string
      title: Taxonomy label
      description: Eyebrow label shown above the content slot (e.g. event type).
      default: Webinar
      examples:
        - Webinar
    date_start:
      type: string
      title: Start date
      description: 'Event start date, shown as-is (e.g. "12 Jun").'
      default: '12 Jun'
      examples:
        - '12 Jun'
    date_end:
      type: string
      title: End date (optional)
      description: 'Event end date, shown as-is (e.g. "30 Jul"). Leave empty for a single-day event — only Start date is shown.'
      default: ''
      examples:
        - '30 Jul'
    date_start_timestamp:
      type: integer
      title: 'Start date (timestamp)'
      description: 'Unix timestamp for the event start, e.g. bound from a Smart date field. When set it formats Start date as "12 Jun" and, unless Time is given, derives Time from the timestamps. Start date wins if both are provided.'
      examples:
        - 1786532400
    date_end_timestamp:
      type: integer
      title: 'End date (timestamp)'
      description: 'Unix timestamp for the event end. Formats End date as "30 Jul" and is only shown when it falls on a different day than the start.'
      examples:
        - 1788100200
    time:
      type: string
      title: Time
      description: Event time (e.g. "11:00 - 2:30 CET"). No Date/Time component covers a time range with a timezone label, so this stays plain text.
      default: '11:00 - 2:30 CET'
      examples:
        - '11:00 - 2:30 CET'
    card_border:
      type: boolean
      title: Card border
      description: Add a default border for the card.
      default: false
      examples:
        - false
    box_shadow:
      type: string
      title: Shadow
      description: Bootstrap shadow utility applied to the card.
      default: shadow-none
      examples:
        - shadow-none
      enum:
        - shadow-none
        - shadow-sm
        - shadow
        - shadow-lg
      meta:enum:
        shadow-none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
    corner_style:
      type: string
      title: Border radius
      description: Bootstrap rounded utility applied to the card.
      default: rounded-4
      examples:
        - rounded-4
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill
    equal_height:
      type: boolean
      title: Equal height
      description: Apply h-100 to the card wrapper.
      default: false
      examples:
        - false
    stretched_link:
      type: boolean
      title: Stretched link
      description: When enabled and a Card link URL is provided, the entire card becomes clickable using Bootstrap's stretched-link.
      default: false
      examples:
        - false
    link_url:
      type: string
      title: Card link URL
      format: uri-reference
      description: Optional URL for the card link.
      default: ''
    link_target:
      type: string
      title: Link target
      enum:
        - default
        - _self
        - _blank
      default: default
      examples:
        - default
      meta:enum:
        default: Default (same tab)
        _self: Same tab
        _blank: New tab
slots:
  content:
    title: Card content
    description: 'Drag & drop content slot. Drop a Heading and a Text component together to form the event title and description. Headings switch to the accent color on hover (leave their text color empty). Text is visually truncated to 3 lines.'

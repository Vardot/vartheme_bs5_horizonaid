$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Profile Card
group: Card
status: stable
description: 'Profile card for a team member: an uploaded photo, a drag-and-drop content area for name and description, and optional social links. Built with Bootstrap 5 utility classes; the photo zooms and the social icons pick up an accent color on hover.'
props:
  type: object
  properties:
    card_border:
      type: boolean
      title: Card border
      description: Add a default border for the card.
      default: false
      examples:
        - false
    background_color:
      type: string
      title: Footer background color
      description: Brand background color applied to the card footer (name, description, and social links).
      default: bg-dark
      examples:
        - bg-dark
      enum:
        - none
        - bg-body-tertiary
        - bg-tertiary
        - bg-accent
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-dark
      meta:enum:
        none: None
        bg-body-tertiary: Body tertiary
        bg-tertiary: Tertiary
        bg-accent: Accent
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-dark: Dark
    box_shadow:
      type: string
      title: Shadow
      description: Bootstrap shadow utility applied to the card.
      default: shadow-none
      examples:
        - shadow-none
      enum:
        - shadow-none
        - shadow-sm
        - shadow
        - shadow-lg
      meta:enum:
        shadow-none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
    corner_style:
      type: string
      title: Border radius
      description: Bootstrap rounded utility applied to the card.
      default: rounded-4
      examples:
        - rounded-4
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill
    equal_height:
      type: boolean
      title: Equal height
      description: Apply h-100 to the card wrapper.
      default: false
      examples:
        - false
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Photo
      description: Upload the profile photo. Fills the card above the footer with a cover crop and zooms slightly on hover.
      examples:
        - src: /themes/contrib/vartheme_bs5_horizonaid/components/foundation/images/assets/avatar-placeholder.png
          alt: ''
          width: 359
          height: 359
    linkedin_url:
      type: string
      title: LinkedIn URL
      format: uri-reference
      description: Optional LinkedIn profile link. Leave empty to hide the icon.
      default: ''
    twitter_url:
      type: string
      title: X (Twitter) URL
      format: uri-reference
      description: Optional X/Twitter profile link. Leave empty to hide the icon.
      default: ''
    facebook_url:
      type: string
      title: Facebook URL
      format: uri-reference
      description: Optional Facebook profile link. Leave empty to hide the icon.
      default: ''
    instagram_url:
      type: string
      title: Instagram URL
      format: uri-reference
      description: Optional Instagram profile link. Leave empty to hide the icon.
      default: ''
slots:
  content:
    title: Profile content
    description: Drag & drop content slot — drop a Heading and a Text component for the person's name and description.

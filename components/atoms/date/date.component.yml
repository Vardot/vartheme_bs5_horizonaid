$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Date
group: Base
status: stable
description: >
  Displays a date using the semantic <time> element.
  The date is rendered as visible text content server-side.
  The "date" prop uses format: date so Drupal Canvas maps it to a datetime
  field. Smart Date field items store a UNIX timestamp instead, so bind those to
  "timestamp" (for example field_when on an event); when set it wins over
  "date".

props:
  type: object
  properties:
    date:
      type: string
      format: date
      title: Date
      description: "ISO 8601 date string (YYYY-MM-DD). Defaults to today's date."
    timestamp:
      type: integer
      title: Date (timestamp)
      description: "UNIX timestamp, e.g. bound from a Smart Date field item. Takes precedence over date."
    format:
      type: string
      title: Date format
      description: "How the date reads. Defaults to the short month form."
      default: "M j, Y"
      enum:
        - "M j, Y"
        - "j F Y"
        - "F j, Y"
        - "j M Y"
        - "d/m/Y"
        - "Y-m-d"
      'meta:enum':
        "M j, Y": "Jun 12, 2026"
        "j F Y": "12 June 2026"
        "F j, Y": "June 12, 2026"
        "j M Y": "12 Jun 2026"
        "d/m/Y": "12/06/2026"
        "Y-m-d": "2026-06-12"
      examples:
        - "j F Y"
    icon:
      type: string
      title: Icon
      description: "Bootstrap icon shown before the date. Defaults to none."
      default: "none"
      enum:
        - "none"
        - "calendar"
        - "calendar-event"
        - "calendar-week"
        - "calendar-check"
        - "clock"
        - "geo-alt"
      'meta:enum':
        "none": "No icon"
        "calendar": "Calendar"
        "calendar-event": "Calendar event"
        "calendar-week": "Calendar week"
        "calendar-check": "Calendar check"
        "clock": "Clock"
        "geo-alt": "Location pin"
      examples:
        - "calendar-event"
    display:
      type: string
      title: Display
      description: "Inline keeps the date on the line it sits in; block puts it on its own line."
      default: "inline"
      enum:
        - "inline"
        - "block"
      'meta:enum':
        "inline": "Inline"
        "block": "Own line"
      examples:
        - "block"
    weight:
      type: string
      title: Font weight
      description: "Bootstrap font-weight utility class applied to the date. Defaults to none."
      enum:
        - "fw-light"
        - "fw-normal"
        - "fw-medium"
        - "fw-semibold"
        - "fw-bold"
      'meta:enum':
        "fw-light": "Light"
        "fw-normal": "Normal"
        "fw-medium": "Medium"
        "fw-semibold": "Semibold"
        "fw-bold": "Bold"
      examples:
        - "fw-bold"
    text_color:
      type: string
      title: Text color
      description: "Bootstrap text-color utility class applied to the date."
      default: "text-body"
      enum:
        - "text-primary"
        - "text-secondary"
        - "text-success"
        - "text-danger"
        - "text-warning"
        - "text-info"
        - "text-muted"
        - "text-white"
        - "text-dark"
        - "text-body"
      'meta:enum':
        "text-primary": "Primary"
        "text-secondary": "Secondary"
        "text-success": "Success"
        "text-danger": "Danger"
        "text-warning": "Warning"
        "text-info": "Info"
        "text-muted": "Muted"
        "text-white": "White"
        "text-dark": "Dark"
        "text-body": "Body text color"
      examples:
        - "text-primary"
    size:
      type: string
      title: Font size
      description: "Bootstrap font-size utility class applied to the date. Defaults to none (inherits from context)."
      enum:
        - "fs-6"
        - "fs-5"
        - "fs-4"
        - "fs-3"
        - "fs-2"
        - "fs-1"
      'meta:enum':
        "fs-6": "Extra small (fs-6)"
        "fs-5": "Small (fs-5)"
        "fs-4": "Medium (fs-4)"
        "fs-3": "Large (fs-3)"
        "fs-2": "Extra large (fs-2)"
        "fs-1": "Display (fs-1)"
      examples:
        - "fs-4"
